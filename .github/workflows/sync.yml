name: UK Fuel Data Sync

on:
  schedule:
    # Runs automatically at minute 15 past every hour (e.g., 10:15, 11:15)
    #- cron: '15 * * * *'
  workflow_dispatch:
    # Allows you to click a button in GitHub to run it manually

jobs:
  sync_data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Run Sync Script
        env:
          GOV_CLIENT_ID: ${{ secrets.GOV_CLIENT_ID }}
          GOV_CLIENT_SECRET: ${{ secrets.GOV_CLIENT_SECRET }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: node sync.js
